name: Verificar seguridad
on:
  push:
    branches: [main, pruebas]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controles:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Herramientas de análisis
        run: python -m pip install -r herramientas/requirements-security.txt
      - name: Dependencias de Python
        run: python -m pip_audit -r punto-de-venta/requirements-build.lock --disable-pip --no-deps
      - name: Dependencias de la página
        working-directory: pagina-administrador
        run: npm audit --package-lock-only --ignore-scripts
      - name: Secretos del historial completo
        run: ./herramientas/Escanear-secretos.ps1
      - name: Código estático y hallazgos revisados
        run: python herramientas/Revisar-bandit.py
