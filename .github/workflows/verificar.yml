name: Verificar código
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencias de pruebas
        run: python -m pip install -r punto-de-venta/requirements-test.txt
      - name: Preparar conector externo de pruebas
        run: ./herramientas/Preparar-conector.ps1
      - name: Pruebas del punto de venta
        working-directory: punto-de-venta
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Pruebas de interfaz
        working-directory: punto-de-venta
        run: node --test test_direction_responses.js test_financial_ui.js test_checkout_scanner.cjs test_movement_retries.cjs
      - name: Dependencias del panel central
        working-directory: pagina-administrador
        run: npm ci
      - name: Pruebas del panel central
        working-directory: pagina-administrador
        run: npm test

      - name: Dependencias verificadas del escritorio
        run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Escritorio real y recuperación tras recarga
        run: python herramientas/Probar-escritorio.py --output work/validacion-escritorio
